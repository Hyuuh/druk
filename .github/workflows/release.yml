name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  # A tag disagreeing with package.json would upload the binaries to one release while
  # the shim it publishes fetched from another — the same broken install as no release
  # at all. Fail in ten seconds rather than after five runners have built.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  # One runner per platform: cross-compiling needs the target's @opentui/core-<platform>
  # package, and `bun install` only fetches the host's.
  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          # The last Intel image Actions offers: macos-13 was retired in December
          # 2025, and x86_64 goes away entirely when this one retires in 2027.
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-latest
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: druk-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Every shipping step reads this one flag, so a dispatch run builds and packages as
    # a dry run and ships nothing. The npm publish once carried no guard of its own
    # while the release upload did: a dispatch run then published a package whose
    # binaries were never uploaded anywhere, and every `npm i druk` fetched a 404.
    env:
      SHIP: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Node is here for `npm publish` alone — provenance is an npm feature.
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: druk-*
      # download-artifact names each directory after the artifact; release.ts wants
      # dist/<target>/druk.
      - run: |
          cd dist
          for dir in druk-*; do mv "$dir" "${dir#druk-}"; done
          chmod +x */druk || true
      - run: bun run release
      # Before npm, not after: the published package holds no binary and fetches one
      # from this release, so an install landing between the two would find nothing.
      - name: Publish the release with the binaries
        if: env.SHIP == 'true'
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # No NODE_AUTH_TOKEN: npm authenticates through OIDC, using the trusted publisher
      # configured for `druk`. An empty token would be worse than none — setup-node
      # writes it into .npmrc and npm then fails with ENEEDAUTH before it ever reaches
      # the OIDC exchange.
      - name: Publish to npm
        if: env.SHIP == 'true'
        run: bun run release --publish
        env:
          NPM_CONFIG_PROVENANCE: true
