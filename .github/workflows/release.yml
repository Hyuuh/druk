name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  # package.json is the single source of the version: the published shim fetches its
  # binaries from `releases/download/v${version}`, so the release has to carry that
  # exact tag. A tag push disagreeing with package.json would upload the binaries to
  # one release while the shim fetched from another — the same broken install as no
  # release at all. Fail in ten seconds rather than after five runners have built.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=v$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One runner per platform: cross-compiling needs the target's @opentui/core-<platform>
  # package, and `bun install` only fetches the host's.
  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          # The last Intel image Actions offers: macos-13 was retired in December
          # 2025, and x86_64 goes away entirely when this one retires in 2027.
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-latest
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: druk-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    # Every run of this job ships, by a tag push or by hand. Nothing here may be made
    # conditional on its own: the npm publish once carried no guard while the release
    # upload did, so a run published a package whose binaries were never uploaded
    # anywhere and every `npm i druk` fetched a 404. Both steps go together.
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Node is here for `npm publish` alone — provenance is an npm feature.
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: druk-*
      # download-artifact names each directory after the artifact; release.ts wants
      # dist/<target>/druk.
      - run: |
          cd dist
          for dir in druk-*; do mv "$dir" "${dir#druk-}"; done
          chmod +x */druk || true
      - run: bun run release
      # git, not `gh release create --target`: GITHUB_TOKEN may create a release for a
      # tag that already exists, but creating one that has to create the tag too comes
      # back `403 Resource not accessible by integration`. Pushing the tag over the
      # checkout's own credentials is plain `contents: write` and works, so a manual
      # run tags the commit here and the release step then finds the tag waiting.
      #
      # A tag push arrives with it already on the remote, and re-running a shipped
      # version reuses the tag it finds rather than moving it — the assets are
      # replaced below, and npm skips a version already on the registry.
      - name: Tag this commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already tagged — reusing it"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
      # Before npm, not after: the published package holds no binary and fetches one
      # from this release, so an install landing between the two would find nothing.
      - name: Publish the release with the binaries
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --title "$VERSION" --generate-notes
          gh release upload "$VERSION" dist/release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # No NODE_AUTH_TOKEN: npm authenticates through OIDC, using the trusted publisher
      # configured for `druk`. An empty token would be worse than none — setup-node
      # writes it into .npmrc and npm then fails with ENEEDAUTH before it ever reaches
      # the OIDC exchange. A version already on the registry is skipped by release.ts,
      # so re-running a shipped version is not an error.
      - name: Publish to npm
        run: bun run release --publish
        env:
          NPM_CONFIG_PROVENANCE: true
